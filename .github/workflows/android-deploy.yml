name: Android Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Güncelleme notu'
        default: 'Hata düzeltmeleri ve iyileştirmeler'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: npm ci

      - name: Keystore hazırla
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > android/app/yeniciftlik.keystore

      - name: APK Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/yeniciftlik.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Versiyon bilgisi al
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | awk '{print $2}' | tr -d '"')
          CODE=$(grep 'versionCode' android/app/build.gradle | awk '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV

      - name: version.json oluştur
        run: |
          cat > version.json << EOF
          {
            "version": "${{ env.APP_VERSION }}",
            "versionCode": ${{ env.VERSION_CODE }},
            "release_notes": "${{ github.event.inputs.release_notes || 'Hata düzeltmeleri ve iyileştirmeler' }}"
          }
          EOF

      - name: Dağıtım reposuna release yükle
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.DIST_REPO }}
          tag_name: yeniciftlik-v${{ env.VERSION_CODE }}
          name: v${{ env.APP_VERSION }}
          body: |
            {"versionCode": ${{ env.VERSION_CODE }}}
            ${{ github.event.inputs.release_notes || 'Hata düzeltmeleri ve iyileştirmeler' }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            version.json
          token: ${{ secrets.GH_TOKEN }}
